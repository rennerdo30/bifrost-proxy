<!--
  Simplified cut of the Bifrost mark, for favicons, app icons and the tray.
  The full mark loses its detail below roughly 48px: at 16px its arch stroke
  is 0.96px, its end nodes 1.92px and its packet dots 0.64px. This keeps the
  plate, the rainbow and the two end nodes, drops the packets, flow dash and
  hub ring, and thickens the arch to 26 units. The plate is a rounded square
  rather than a circle because that is the app-icon idiom and it fills more
  pixels at small sizes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="bifrost-icon-title">
  <title id="bifrost-icon-title">Bifrost Proxy</title>
  <defs><linearGradient id="bifrostIconSpan" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#FF6B6B"/><stop offset="25%" stop-color="#FFE66D"/><stop offset="50%" stop-color="#96CEB4"/><stop offset="75%" stop-color="#4ECDC4"/><stop offset="100%" stop-color="#45B7D1"/></linearGradient><linearGradient id="bifrostIconPlate" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a1a2e"/><stop offset="100%" stop-color="#16213e"/></linearGradient></defs>
  <rect x="4" y="4" width="192" height="192" rx="44" fill="url(#bifrostIconPlate)"/>
  <path d="M36 138Q100 44 164 138" fill="none" stroke="url(#bifrostIconSpan)" stroke-width="26"
        stroke-linecap="round"/>
  <circle cx="36" cy="138" r="17" fill="#FF6B6B"/>
  <circle cx="164" cy="138" r="17" fill="#45B7D1"/>
</svg>
