# Dependabot configuration.
#
# Every version update across all ecosystems lands in ONE pull request per
# week (a multi-ecosystem group), so the review queue never holds more than
# one dependency PR. A short cooldown skips releases that are only hours old.
# Security updates are not delayed and arrive as soon as an advisory matches.
version: 2

multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"

updates:
  - package-ecosystem: "npm"
    directories:
      - "/desktop/frontend"
      - "/docs"
      - "/web/client"
      - "/web/server"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    cooldown:
      default-days: 3
    ignore:
      # TypeScript majors are held back by the linter, not by our code. The
      # latest stable typescript-eslint (8.67.0) declares
      # `peer typescript@">=4.8.4 <6.1.0"`, and its parser hard-errors with
      # "typescript-eslint does not support TS 7.0" if installed anyway, so
      # `npm ci` fails before any build step runs. TypeScript 7 also removed
      # `baseUrl`, so it needs a tsconfig migration in every frontend.
      # Revisit once typescript-eslint ships stable TS 7 support: bump
      # typescript + typescript-eslint + the tsconfigs together.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # /mobile is its own entry: Expo pins react, react-native and expo-* to the
  # SDK release, so those move only via an Expo SDK upgrade
  # (`npx expo install --fix`), which resolves the whole set together.
  - package-ecosystem: "npm"
    directory: "/mobile"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "react"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native-async-storage/*"
      - dependency-name: "@types/react"
      # Expo's Metro/babel preset requires Babel 7; Babel 8 breaks the bundler.
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
      # See the typescript note on the npm entry above.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/desktop"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    cooldown:
      default-days: 3

  - package-ecosystem: "docker"
    directory: "/docker"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    cooldown:
      default-days: 3

  - package-ecosystem: "docker-compose"
    directory: "/docker"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    cooldown:
      default-days: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    cooldown:
      default-days: 3
