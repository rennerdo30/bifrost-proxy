<!--
  Bifrost mark: a faceted span crossing between two realms.

  Hand-built on a 4-unit grid inside a 64x40 viewBox, artwork bounds 4,4-60,36,
  so every horizontal and vertical stroke edge lands on a whole pixel at 16px.
  Three flat colours, no gradients: the two landings (cyan / violet) and the
  span itself in the product accent blue. The span is drawn first and the two
  landings overlap it, which puts the colour seams on straight runs of the leg
  - butt caps there mean the seams are clean lines, not lobes.

  Colours come from the dashboard palette (web/server/src/index.css) and follow
  the viewer's colour scheme. The stroke="..." presentation attributes are the
  fallback for renderers that ignore the stylesheet; assets/logo-light.svg and
  assets/logo-dark.svg pin one palette each for contexts that cannot resolve
  prefers-color-scheme, and assets/logo-mono.svg is the single-colour cut.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 40" width="256" height="160"
     class="bifrost-mark" role="img" aria-labelledby="bifrost-logo-title">
  <title id="bifrost-logo-title">Bifrost Proxy</title>
  <style>
    .bifrost-mark {
      --bifrost-span: #2563eb;
      --bifrost-realm-in: #0891b2;
      --bifrost-realm-out: #7c3aed;
    }
    @media (prefers-color-scheme: dark) {
      .bifrost-mark {
        --bifrost-span: #3b82f6;
        --bifrost-realm-in: #22d3ee;
        --bifrost-realm-out: #8b5cf6;
      }
    }
    .bifrost-mark .bifrost-span { stroke: var(--bifrost-span); }
    .bifrost-mark .bifrost-realm-in { stroke: var(--bifrost-realm-in); }
    .bifrost-mark .bifrost-realm-out { stroke: var(--bifrost-realm-out); }
  </style>
  <g fill="none" stroke-width="8" stroke-linecap="butt" stroke-linejoin="miter">
    <path class="bifrost-span" stroke="#2563eb" d="M20 24V14L26 8H38L44 14V24"/>
    <path class="bifrost-realm-in" stroke="#0891b2" d="M4 32H20V20"/>
    <path class="bifrost-realm-out" stroke="#7c3aed" d="M44 20V32H60"/>
  </g>
</svg>
