<!--
  Bifrost mark for light backgrounds: transparent, no plate.
  Same geometry as assets/logo.svg with the light-theme palette pinned, for
  contexts that cannot resolve prefers-color-scheme (e.g. a GitHub <picture>).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 40" width="256" height="160"
     role="img" aria-labelledby="bifrost-logo-light-title">
  <title id="bifrost-logo-light-title">Bifrost Proxy</title>
  <g fill="none" stroke-width="8" stroke-linecap="butt" stroke-linejoin="miter">
    <path stroke="#2563eb" d="M20 24V14L26 8H38L44 14V24"/>
    <path stroke="#0891b2" d="M4 32H20V20"/>
    <path stroke="#7c3aed" d="M44 20V32H60"/>
  </g>
</svg>
