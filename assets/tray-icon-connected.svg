<!--
  Tray icon, connected: the small-size cut of the Bifrost mark in a single
  status colour on a transparent 64x64 canvas, so the host tray composites it
  on light or dark chrome. Same geometry as assets/icon.svg without the plate -
  see that file for the construction notes. The 4-unit gap between the two arch
  bands is what keeps the arch reading as banded line work rather than a solid
  dome once everything is one ink.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-labelledby="tray-connected-title">
  <title id="tray-connected-title">Bifrost: connected</title>
  <g fill="none" stroke="#22c55e" stroke-linecap="butt" stroke-linejoin="miter">
    <g stroke-width="4">
      <path d="M22 28A10 10 0 0 1 32 18A10 10 0 0 1 42 28"/>
      <path d="M14 28A18 18 0 0 1 32 10A18 18 0 0 1 50 28"/>
    </g>
    <g stroke-width="8">
      <path d="M8 32H56"/>
      <path d="M20 32V52"/>
      <path d="M44 32V52"/>
      <path d="M8 52H24"/>
      <path d="M40 52H56"/>
    </g>
  </g>
</svg>
