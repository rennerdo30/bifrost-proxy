<!--
  Tray icon, connected: the Bifrost mark in a single status colour on a
  transparent 64x64 canvas. Same grid as assets/icon.svg without the plate, so
  the host tray composites it on light or dark chrome.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-labelledby="tray-connected-title">
  <title id="tray-connected-title">Bifrost: connected</title>
  <path d="M8 44H20V26L26 20H38L44 26V44H56" fill="none" stroke="#22c55e" stroke-width="8"
        stroke-linecap="butt" stroke-linejoin="miter"/>
</svg>
