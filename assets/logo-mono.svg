<!--
  Single-colour cut: the span alone, no plate and no gradient, for small UI
  chrome, stencils and print. Inlined in a page it inherits the surrounding
  text colour. The svg:root fallback only applies when this file is rendered
  as its own document, and is a mid-tone that stays legible on both light and
  dark grounds rather than flipping on the viewer's colour scheme.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="bifrost-mono-title">
  <title id="bifrost-mono-title">Bifrost Proxy</title>
  <style>svg:root { color: #64748b; }</style>
  <g fill="none" stroke="currentColor">
    <path d="M36 138Q100 44 164 138" stroke-width="26" stroke-linecap="round"/>
  </g>
  <circle cx="36" cy="138" r="17" fill="currentColor"/>
  <circle cx="164" cy="138" r="17" fill="currentColor"/>
</svg>
