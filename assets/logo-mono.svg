<!--
  Single-colour Bifrost mark for UI chrome, print and stencils. Identical
  geometry to assets/logo.svg (see that file for the construction notes); the
  4-unit gaps between the three arch bands are why the banding still reads once
  the colour is gone.

  Inlined in a page, every member inherits the surrounding text colour
  (currentColor), so the mark takes whatever the host has decided is legible.

  The svg:root rule only matches when this file is rendered as its own document
  - a favicon, an <img>, or opened directly - where there is no text colour to
  inherit. It never overrides the host page's colour when the SVG is inlined.
  It deliberately does *not* branch on prefers-color-scheme: that follows the
  viewer's OS theme rather than the surface the mark is sitting on, so an
  <img src="logo-mono.svg"> on a mismatched background used to come out nearly
  invisible. #64748b is a neutral mid-tone that clears 4:1 contrast against
  both #ffffff (4.8:1) and #0a0e17 (4.1:1), so a standalone render is legible
  on either surface under either OS theme.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 88" width="384" height="176"
     role="img" aria-labelledby="bifrost-logo-mono-title">
  <title id="bifrost-logo-mono-title">Bifrost Proxy</title>
  <style>
    svg:root { color: #64748b; }
  </style>
  <g fill="none" stroke="currentColor" stroke-linecap="butt" stroke-linejoin="miter">
    <g stroke-width="4">
      <path d="M80 36V52"/>
      <path d="M88 32V52"/>
      <path d="M96 32V52"/>
      <path d="M104 32V52"/>
      <path d="M112 36V52"/>
    </g>
    <g stroke-width="8">
      <path d="M52 76A44 44 0 0 1 96 32A44 44 0 0 1 140 76"/>
      <path d="M40 76A56 56 0 0 1 96 20A56 56 0 0 1 152 76"/>
      <path d="M28 76A68 68 0 0 1 96 8A68 68 0 0 1 164 76"/>
      <path d="M4 52H188"/>
      <path d="M12 52V80"/>
      <path d="M180 52V80"/>
      <path d="M4 80H56"/>
      <path d="M136 80H188"/>
    </g>
  </g>
</svg>
